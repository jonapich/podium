<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Podium</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Sets the theme attributes before first paint so a stored choice never flashes the default. Mirrors
      // parseChoice and resolveMode in src/fleet/themes.ts; the palette fallback is handled by useTheme once React loads.
      (function () {
        try {
          var raw = JSON.parse(localStorage.getItem("podium.theme"));
          var theme = "podium", mode = "system";
          if (raw === "light" || raw === "dark") mode = raw;
          else if (raw && typeof raw === "object") {
            if (/^(solarized|nord|gruvbox|catppuccin|github)$/.test(raw.theme)) theme = raw.theme;
            if (/^(light|dark|system)$/.test(raw.mode)) mode = raw.mode;
          }
          var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          var d = document.documentElement.dataset;
          d.themeName = theme; d.theme = dark ? "dark" : "light"; d.mode = mode;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
